<script>
'use strict';
// SCENE CONFIG START
const SCENE = { title:'서울광장, RUN | Prompt Animation', filename:'seoul-plaza-run', width:900, height:1600, duration:12, loop:false, controls:{zoom:1,motion:1,snow:1,ignition:0,tint:'#ffc570',tintStrength:0}, actionLabel:'트리 점등', hitbox:[155,285,755,1100] };
// SCENE CONFIG END
const stage = document.querySelector('#stage'), ctx = stage.getContext('2d');
const play = document.querySelector('#play'), seek = document.querySelector('#scrub'), clock = document.querySelector('#clock');
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const mix = (a,b,t)=>a+(b-a)*t;
const ease = (a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
const TAU = Math.PI*2;
function seeded(seed){return ()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
// SCENE CODE START
const W=900,H=1600, cx=452, tip=330, foot=1080;
const rng=seeded(2391);
const gold=['#ffc570','#ffe4a4','#fff1c6','#f2aa53'];
const pine=['#0a3140','#15505a','#257369','#4c9787','#295c61'];
const R=(a,b)=>mix(a,b,rng());
const stars=Array.from({length:125},()=>[R(0,W),R(55,798),R(.25,1.5),R(.12,.65),R(0,6)]);
const snow=Array.from({length:198},(_,i)=>[R(-75,975),R(0,H),R(30,165),R(.4,i<160?2.2:4.4),R(0,TAU),R(.24,.89)]);
const trees=Array.from({length:20},(_,i)=>[i*51+R(-15,15),R(953,1035),R(28,93)]);
const ground=Array.from({length:900},()=>[R(-30,930),R(1045,1615),R(.35,1.7),R(.04,.22)]);
const lights=Array.from({length:590},()=>{const p=R(.035,.975), f=R(-1,1); return [p,f,R(0,TAU),R(.65,2.15),rng()>.89?'#e57977':rng()>.86?'#81d9d2':gold[Math.floor(rng()*gold.length)]]});
const foliage=Array.from({length:2300},()=>[R(.005,.985),R(-1,1),R(.8,9),Math.floor(rng()*5),R(.24,.93)]);
const drift=Array.from({length:64},()=>[R(-1,1),R(0,TAU),R(.5,2.6),R(.4,1)]);
function rgba(r,g,b,a){return `rgba(${r},${g},${b},${clamp(a)})`}

function dot(g,x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
function wire(g,points,color,width=1){g.beginPath();g.moveTo(...points[0]);for(let j=1;j<points.length;j++)g.lineTo(...points[j]);g.lineWidth=width;g.strokeStyle=color;g.stroke()}
function poly(g,points,color,edge,width=1){g.beginPath();g.moveTo(...points[0]);for(let j=1;j<points.length;j++)g.lineTo(...points[j]);g.closePath();g.fillStyle=color;g.fill();if(edge){g.strokeStyle=edge;g.lineWidth=width;g.stroke()}}
function glow(g,x,y,r,rgb,a){const grad=g.createRadialGradient(x,y,0,x,y,r);grad.addColorStop(0,rgba(...rgb,a));grad.addColorStop(.3,rgba(...rgb,a*.56));grad.addColorStop(1,rgba(...rgb,0));g.fillStyle=grad;g.fillRect(x-r,y-r,r*2,r*2)}

function treeWidth(p){return (3+285*Math.pow(p,.83))*(1+.077*Math.sin(p*TAU*8-.5)+.022*Math.sin(p*TAU*23))}
function treeCenter(p,t){return cx+7*Math.sin(p*9)*p+Math.sin(t*.8+p*8)*p*2}
function cross(g,x,y,r,col,w=1){wire(g,[[x-r,y],[x+r,y]],col,w);wire(g,[[x,y-r],[x,y+r]],col,w)}
function dataFrame(){const c=document.createElement('canvas');c.width=W;c.height=H;return c}
const cityLayer=dataFrame();
function makeSkyline(g){
  const wave=[[302,851],[361,767],[424,723],[506,676],[615,654],[729,655],[824,679],[893,723],[957,777]];

  for(let x=303;x<990;x+=31)wire(g,[[x-70,1000],[x+12,676]],'#3a657c',1.1);
  for(let x=521;x<920;x+=35)for(let i=0;i<8;i++){const y=745+i*25-((x-521)/35)*2;if(Math.sin(x*i*.44)>.23)box(g,x,y,12,2,'#597989')}
  g.restore();
  const buildings=[[0,775,112,279],[103,831,84,224],[183,754,119,301],[297,887,78,168],[750,800,98,235],[827,748,100,310]];
  for(const [x,y,w,h] of buildings){
    box(g,x,y,w,h,'#0a2033');wire(g,[[x,y+h],[x,y],[x+w,y],[x+w,y+h]],'#35576a',1.5);
    wire(g,[[x-2,y-4],[x+w+2,y-4]],'#597184',2);
    for(let xx=x+10;xx<x+w-5;xx+=15)for(let yy=y+19;yy<y+h-24;yy+=20){box(g,xx,yy,7,8,Math.sin(xx*97+yy*9)>.72?'#646652':'#153348');}
  }
  for(const [x,y,h] of trees){wire(g,[[x,y],[x,y-h]],'#172d3d',3);for(let k=1;k<5;k++){const j=y-h*k/6;wire(g,[[x-h*.19,j-h*.17],[x,j],[x+h*.23,j-h*.19]],'#294252',1.1)}}
  const wall='#213f4a', masonry='#4c6569', trim='#a5b2a3';
  box(g,65,916,779,132,wall);
  poly(g,[[46,931],[99,865],[291,865],[315,905],[602,905],[632,865],[804,865],[858,931]],'#19343e',trim,2.1);
  for(const [a,b,y] of [[79,830,937],[77,830,971],[70,837,1017],[65,844,1047]])wire(g,[[a,y],[b,y]],masonry,3);
  for(const x of [72,280,294,614,628,829]){box(g,x,926,9,118,'#395660');wire(g,[[x+1,928],[x+1,1044]],trim,1)}

    box(g,x,y,15,18,'#142b38');g.strokeStyle=masonry;g.lineWidth=1;g.strokeRect(x,y,15,18);
    if((x+y)%5>1){box(g,x+3,y+3,9,12,'#6d7563');wire(g,[[x+8,y+2],[x+8,y+16]],'#273c42',1)}
  }
  poly(g,[[341,1048],[341,888],[383,849],[411,849],[411,804],[452,777],[494,804],[494,847],[520,847],[564,885],[564,1048]],'#243e45','#8a9c94',2);
  for(const y of [882,901,914,953,1005,1047])wire(g,[[347,y],[559,y]],'#68827e',2);
  for(const x of [367,397,428,459,491,522]){box(g,x,928,17,65,'#334c50');wire(g,[[x,993],[x,932],[x+9,921],[x+17,932],[x+17,993]],'#7a8e84',2)}
  dot(g,452,831,15,'#a0aa98');dot(g,452,831,12,'#273d46');wire(g,[[452,822],[452,831],[458,834]],'#c5b485',1.7);
  for(let x=105;x<819;x+=19)wire(g,[[x,860],[x+19,864]],'#9caa9e',1.4);
  for(let i=0;i<ground.length;i++){const [x,y,r,a]=ground[i];box(g,x,y,r*(1+(y-1045)/290),r,rgba(143,181,204,a))}
}
makeSkyline(cityLayer.getContext('2d'));
function drawSky(g,t,lit){
  const sky=g.createLinearGradient(0,-50,0,H);
  sky.addColorStop(0,'#06101c');sky.addColorStop(.28,'#102634');sky.addColorStop(.51,lit>.4?'#2a3e4c':'#203947');sky.addColorStop(.72,'#193747');sky.addColorStop(1,'#06141e');
  box(g,0,0,W,H,sky);
  glow(g,692,454,368,[84,144,160],.22);glow(g,412,907,488,[155,158,121],.08+.16*lit);
  for(const [x,y,r,a,ph] of stars){dot(g,x,y,r,rgba(180,208,214,a*(.82+.18*Math.sin(t+ph))))}
  const mx=714,my=372;glow(g,mx,my,118,[199,223,208],.09);dot(g,mx,my,33,'#cfdfd1');dot(g,mx+11,my-8,31,'#19303e');
  for(let k=0;k<3;k++){g.beginPath();g.moveTo(-90,610+k*60);g.bezierCurveTo(191,510+k*58,588,791+k*12,1010,598+k*36);g.lineWidth=23+k*13;g.strokeStyle=rgba(115,171,181,.027);g.stroke()}
}
function drawSquare(g,t,lit){
  const gnd=g.createLinearGradient(0,1015,0,1600);
  gnd.addColorStop(0,'#1d3844');gnd.addColorStop(.24,'#1a3441');gnd.addColorStop(1,'#081923'); box(g,0,1037,W,590,gnd);
  const persp=[-1360,-900,-560,-260,27,240,455,676,909,1246,1550,1840];
  for(const x of persp)wire(g,[[451+(x-451)*.12,1037],[x,1606]],rgba(126,165,178,.19),1.1);
  for(const y of [1063,1089,1123,1168,1228,1308,1416,1555])wire(g,[[0,y],[W,y+1]],rgba(128,163,174,.23),1.3);
  g.drawImage(cityLayer,0,0);
  if(lit>.012){
    g.save();g.translate(cx,1092);g.scale(1.66,.49);glow(g,0,264,350,[229,169,83],.29*lit);g.restore();
    for(let i=0;i<171;i++){const [x0,y0,r]=ground[i];const delta=(x0-W/2), y=y0+21;if(Math.abs(delta)>83+(y-1060)*.36||y>1508)continue;const wav=.62+.38*Math.sin(t*2.1+i*.61);const x=cx+delta*.88+Math.sin(t*1.35+i*.3)*7;box(g,x,y,r*(7+(y-1060)*.046),r*.8,rgba(255,186+i%42,101,lit*wav*(1-(y-1060)/570)*.63));}
  }
  for(const [x,y,scale] of [[143,1083,1],[756,1059,.79],[228,1035,.52],[662,1032,.51]]){
    const top=y-149*scale;
    wire(g,[[x,y],[x,top+10]],'#203941',5*scale);wire(g,[[x-1.5,y-3],[x-1.5,top+13]],'#9b9c7d',1.2*scale);
    poly(g,[[x-13*scale,top],[x+13*scale,top],[x+8*scale,top+18*scale],[x-8*scale,top+18*scale]],'#a48354','#a5a07c',scale);
    box(g,x-5*scale,top+3*scale,10*scale,11*scale,'#ffe2a0');glow(g,x,top+9*scale,63*scale,[255,195,105],.27);
  }
}
function drawTree(g,t,lit,asc){
  const footFade=ease(.05,1.4,t), bottom=foot-tip;
  box(g,cx-14,1023,33,68,'#12313b');
  g.beginPath();g.moveTo(treeCenter(0,t),tip);
  for(let i=1;i<=150;i++){const p=i/150;g.lineTo(treeCenter(p,t)-treeWidth(p),tip+bottom*p)}
  for(let i=150;i>=0;i--){const p=i/150;g.lineTo(treeCenter(p,t)+treeWidth(p),tip+bottom*p)}
  g.closePath();
  const greenery=g.createLinearGradient(175,610,712,876);greenery.addColorStop(0,'#103842');greenery.addColorStop(.53,'#153b46');greenery.addColorStop(1,'#071f2a');
  g.fillStyle=greenery;g.fill();g.strokeStyle='#386c69';g.lineWidth=1.7;g.stroke();
  g.save();g.clip();
  if(lit>.005)glow(g,427,773,471,[48,143,111],.25*lit);
  for(const [p,f,len,col,op] of foliage){const x=treeCenter(p,t)+f*treeWidth(p),y=tip+p*bottom;g.globalAlpha=op*(.59+lit*.41);g.fillStyle=pine[col];g.fillRect(x,y,len*(.48+p*.65),.8+p*1.4);}
  g.globalAlpha=1;
  for(let i=0;i<22;i++){const p=.08+i*.041, x=treeCenter(p,t), y=tip+bottom*p, w=treeWidth(p);g.beginPath();g.moveTo(x-w*.97,y-10);g.quadraticCurveTo(x-w*.33,y+9,x,y-15);g.quadraticCurveTo(x+w*.46,y+8,x+w*.96,y-3);g.strokeStyle=rgba(136,171,146,.12+lit*.12);g.lineWidth=1.1;g.stroke();}
  g.restore();
  for(let coil=0;coil<5;coil++)for(let k=0;k<66;k++){
    const a=k/65, p=.13+(coil+a)*.163, x=treeCenter(p,t)+treeWidth(p)*(-.95+1.9*a), y=tip+bottom*p+Math.sin(a*Math.PI)*(17+coil*4);
    const ignition=ease(1-p,1-p+.19,asc), q=ignition*(.76+.24*Math.sin(t*3-a*8+coil*1.7));
    if(q>.02){dot(g,x,y,.8+p*1.45,rgba(255,192+coil*8,108,q));if(k%11===0)glow(g,x,y,13+p*9,[255,177,83],q*.19)}
  }
  for(const [p,f,ph,r,color] of lights){
    const x=treeCenter(p,t)+f*treeWidth(p), y=tip+bottom*p;

    g.globalAlpha=(.36+q*.64)*tw;dot(g,x,y,r*(.7+p*.88),color);

  g.globalAlpha=1;
  for(let i=0;i<17;i++){
    const f=lights[i*29],p=.25+f[0]*.67,x=treeCenter(p,t)+f[1]*treeWidth(p)*.91,y=tip+bottom*p;
    const q=ease(1-p,1-p+.24,asc); if(q<.1)continue;
    const colors=i%3===0?['#a04d59','#e9a090']:i%3===1?['#92805a','#ffdba4']:['#347a7b','#9fccc4'];
    g.globalAlpha=q;dot(g,x,y,4.5+p*4.5,colors[0]);dot(g,x-1.6,y-2.2,1.4,colors[1]);cross(g,x,y,3.8,colors[1],.7);
  }
  g.globalAlpha=1;
  const s=ease(5.2,6.18,t), swell=Math.sin(Math.PI*ease(5.48,6.66,t));

    glow(g,cx,310,100+40*swell,[255,189,98],.4*s);glow(g,cx,310,39,[255,219,149],.84*s);
    for(let i=0;i<48;i++){const [d,ph,r,a]=drift[i], angle=ph+t*.12, radial=34+a*(40+swell*91),x=cx+Math.cos(angle)*radial,y=310+Math.sin(angle)*radial*.8;dot(g,x,y,r*.72,rgba(255,213,135,s*(.38+swell*.42)*(.67+.33*Math.sin(d*21+t*5))))}
    wire(g,[[cx-57-swell*65,310],[cx+57+swell*65,310]],rgba(255,207,126,s*(.41+.36*swell)),1.3);
    wire(g,[[cx,266-swell*47],[cx,357+swell*42]],rgba(255,207,126,s*(.45+.3*swell)),1.4);
  }
  const shape=[];for(let i=0;i<16;i++){const a=-Math.PI/2+i*Math.PI/8, r=i%2?9:i%4===0?31:19;shape.push([cx+Math.cos(a)*r,310+Math.sin(a)*r]);}
  poly(g,shape,s>.6?'#fff1c4':'#35545a',s>.6?'#ffe1a2':'#839795',1.4);
}

  if(o.tintStrength){g.save();g.globalCompositeOperation='soft-light';g.globalAlpha=o.tintStrength;g.fillStyle=o.tint;g.fillRect(x,y,w,h);g.restore()}
}
function codeExcerpt(){const lines=rendererSource.split('\n');const start=Math.max(0,lines.findIndex(l=>/^function drawScene\(/.test(l)));return lines.slice(start,start+8).map((s,i)=>[start+i+1,s]);}
function renderWithCode(g,t){
  const {width:w,height:h}=g.canvas,p=54,split=Math.round(h*.738),top=28, end=split-30;
  g.fillStyle='#07101a';g.fillRect(0,0,w,h);g.save();g.beginPath();g.rect(0,0,w,end);g.clip();const artW=Math.min(w,(end-top)*SCENE.width/SCENE.height);renderFilm(g,t,renderSettings,(w-artW)/2,top,artW,end-top);g.restore();
  g.fillStyle='#101b29';g.fillRect(0,split,w,h-split);g.fillStyle='#284451';g.fillRect(0,split,w,2);
  g.textBaseline='top';g.fillStyle='#8fe5d2';g.font='600 24px ui-monospace,monospace';g.fillText('PROMPT / ANIMATION',p,split+22);
  g.fillStyle='#99aec5';g.textAlign='right';g.fillText('drawScene()  ·  JavaScript',w-p,split+22);g.textAlign='left';
  g.save();g.beginPath();g.rect(p+48,split+72,w-(p*2)-48,h-split-88);g.clip();
  g.font='23px ui-monospace,monospace';codeExcerpt().forEach(([n,line],i)=>{g.fillStyle=i===0?'#e8c072':'#c9d7e6';g.fillText(line,p+50,split+79+i*38);});g.restore();
  g.font='20px ui-monospace,monospace';g.fillStyle='#819ab4';codeExcerpt().forEach(([n],i)=>g.fillText(String(n).padStart(2,'0'),p,split+80+i*38));
}
const videoButtons=[$('video-scene'),$('video-code')];
function exportStart(){if(exporting)throw Error('이미 내보내는 중입니다.');exporting=true;renderSettings={...settings};stop();videoButtons.forEach(b=>b.disabled=true);}
function exportEnd(){exporting=false;renderSettings=null;videoButtons.forEach(b=>b.disabled=false);}
const targetName=SCENE.filename||'prompt-animation';
bindVideoExport({button:videoButtons[0],status:$('video-status'),width:stage.width,height:stage.height,duration:SCENE.duration,render:(g,t)=>renderFilm(g,t,renderSettings),filename:targetName,onBegin:exportStart,onEnd:exportEnd});
bindVideoExport({button:videoButtons[1],status:$('video-status'),width:1080,height:1920,duration:SCENE.duration,render:renderWithCode,filename:targetName+'-with-code',onBegin:exportStart,onEnd:exportEnd});

let sceneMode='auto', scrollRaf=0;
const modeHint=$('mode-hint'), actionButton=$('perform-action');
const modeCopy={auto:'자동으로 처음부터 재생합니다.', still:'슬라이더로 원하는 순간을 골라 정지 화면으로 감상하세요.', action:SCENE.actionLabel?'트리를 클릭하거나 점등 버튼을 누르세요.':'장면을 클릭하거나 실행 버튼을 누르세요.', scroll:'화면을 아래로 스크롤하면 진행되고 위로 올리면 되감깁니다.'};
const modeButtons=[...document.querySelectorAll('[data-playmode]')];
function modeState(val){
  sceneMode=val; stop();
  document.body.classList.toggle('scroll-mode',val==='scroll');
  modeButtons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.playmode===val)));
  actionButton.hidden=val!=='action'; modeHint.textContent=modeCopy[val];
  play.disabled=val==='scroll'||val==='still'||val==='action';
  seek.disabled=val==='scroll';
  if(val==='auto'){setTime(0);start();}
  if(val==='action'){setTime(0);}
  if(val==='scroll'){setTime(0); requestAnimationFrame(syncScroll);}
}
function syncScroll(){
  scrollRaf=0;if(sceneMode!=='scroll'||exporting||clean)return;
  const el=$('scroll-area'), span=el.offsetHeight-$('scene-view').offsetHeight;
  if(span>0)setTime(clamp(-el.getBoundingClientRect().top/span)*SCENE.duration);
}
function kick(){if(sceneMode!=='action'||exporting)return;setTime(0);start();}
function stageAction(e){
  if(sceneMode==='auto'){toggle();return;}
  if(sceneMode!=='action')return;
  if(!SCENE.hitbox){kick();return;}
  const r=stage.getBoundingClientRect(), s=Math.min(r.width/SCENE.width,r.height/SCENE.height);
  const zoom=settings.zoom||1;
  const x=SCENE.width/2+(e.clientX-r.left-r.width/2)/(s*zoom);
  const y=SCENE.height/2+(e.clientY-r.top-r.height/2)/(s*zoom);
  const [a,b,c,d]=SCENE.hitbox;if(x>=a&&y>=b&&x<=c&&y<=d)kick();
}
function resetByMode(){if(sceneMode==='scroll'){const el=$('scroll-area');window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY,behavior:'instant'});syncScroll();}else setTime(0);}
modeButtons.forEach(b=>b.addEventListener('click',()=>modeState(b.dataset.playmode)));
actionButton.textContent=SCENE.actionLabel||'장면 실행';actionButton.addEventListener('click',kick);
window.addEventListener('scroll',()=>{if(sceneMode==='scroll'&&!scrollRaf)scrollRaf=requestAnimationFrame(syncScroll);},{passive:true});
window.addEventListener('resize',()=>{if(sceneMode==='scroll'&&!scrollRaf)scrollRaf=requestAnimationFrame(syncScroll);});

setClean(clean);paint();const requestedMode=params.get('mode');if(['still','action','scroll'].includes(requestedMode))modeState(requestedMode);else if(auto)start();
</script></body></html>
